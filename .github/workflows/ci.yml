name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: swoole
      - name: Lint PHP sources with the matrix runtime
        run: find src tests benchmark publish -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: ramsey/composer-install@v3
      - run: composer check
